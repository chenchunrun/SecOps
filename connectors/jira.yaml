api_version: secops/connectors/v1
name: jira
version: 1.0.0
provider: Jira
data_scopes: [issues:read, issues:write]
credential: {type: oauth2, scopes: [read:jira-work], short_lived: true}
provider_api_version: v3
rate_limit: {max_retries: 3, backoff: 1s}
health_path: /rest/api/3/myself
event_schema: secops-event-v1
operations:
  - {name: query_issues, method: GET, path: /rest/api/3/search, side_effect: false, risk: low}
  - {name: create_issue, method: POST, path: /rest/api/3/issue, side_effect: true, risk: medium}
