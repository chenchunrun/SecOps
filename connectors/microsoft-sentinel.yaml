api_version: secops/connectors/v1
name: microsoft-sentinel
version: 1.0.0
provider: Microsoft Sentinel
data_scopes: [incidents:read, incidents:write]
credential: {type: oauth2, scopes: [SecurityIncident.Read.All], short_lived: true}
provider_api_version: 2025-06-01
rate_limit: {max_retries: 3, backoff: 1s}
health_path: /incidents
event_schema: secops-event-v1
operations:
  - {name: query_incidents, method: GET, path: /incidents, side_effect: false, risk: low}
  - {name: update_incident, method: PATCH, path: /incidents, side_effect: true, risk: high}
