api_version: secops/v1
name: phishing-analysis
version: 1.0.0
description: Analyze suspicious email without executing untrusted attachments.
roles:
  - security_expert
capabilities:
  required:
    - file:read
    - threat_intel:query
risk:
  base: medium
  parameter_rules:
    attachment_execute: critical
    external_upload: high
runtime:
